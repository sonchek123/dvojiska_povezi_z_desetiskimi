<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poveži števila</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #f9f9f9;
    }
    h1 {
      margin-bottom: 0.5rem;
    }
    #instructions {
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }
    #controls {
      margin-bottom: 1.5rem;
    }
    .btn-group button {
      margin: 0.25rem;
      padding: 0.5rem 1rem;
      border: 2px solid #ccc;
      background: white;
      cursor: pointer;
    }
    .btn-group button.selected {
      border-color: #1e88e5;
      background-color: #e3f2fd;
      font-weight: bold;
    }
    .columns {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }
    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 1 200px;
    }
    .placeholder, .dropzone {
      height: 42px;
      margin: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pair {
      padding: 0.5rem 1rem;
      border: 1px dashed #aaa;
      background: white;
      width: 100px;
      cursor: move;
    }
    .dropzone {
      border: 2px dashed #aaa;
      background-color: #eee;
      width: 100px;
      transition: background-color 0.5s, border-color 0.5s;
    }
  </style>
</head>
<body>
  <h1>Poveži števila</h1>
  <div id="instructions">
    Izberi število nalog, ki jih želiš rešiti. Izberi obseg števil.<br />
    Dvojiško število iz levega stolpca potegni na ustrezno desetiško število.
  </div>
  <div id="controls">
    <div class="btn-group">
      <span>Število parov:</span>
      <button data-count="5">5</button>
      <button data-count="10" class="selected">10</button>
      <button data-count="15">15</button>
    </div>
    <div class="btn-group">
      <span>Obseg števil:</span>
      <button data-max="15" class="selected">1–15</button>
      <button data-max="31">1–31</button>
      <button data-max="63">1–63</button>
    </div>
    <div>
      <button onclick="generatePairs()">Ustvari nalogo</button>
    </div>
  </div>
  <div class="columns">
    <div class="column" id="binary"></div>
    <div class="column" id="decimal"></div>
  </div>

  <script>
    let pairCount = 10;
    let numberMax = 15;

    document.querySelectorAll('[data-count]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-count]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        pairCount = parseInt(btn.dataset.count);
      });
    });

    document.querySelectorAll('[data-max]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-max]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        numberMax = parseInt(btn.dataset.max);
      });
    });

    function generatePairs() {
      const numbers = Array.from({ length: numberMax }, (_, i) => i + 1);
      const selected = shuffle(numbers).slice(0, pairCount);

      const binaryCol = document.getElementById('binary');
      const decimalCol = document.getElementById('decimal');
      binaryCol.innerHTML = '';
      decimalCol.innerHTML = '';

      const binaryPairs = selected.map(n => ({ value: n.toString(2).padStart(5, '0'), match: n.toString() }));
      const decimalPairs = selected.map(n => n.toString());

      binaryPairs.forEach(pair => {
        const container = document.createElement('div');
        container.className = 'placeholder';
        container.id = 'placeholder-' + pair.value;

        const div = document.createElement('div');
        div.className = 'pair';
        div.textContent = pair.value;
        div.draggable = true;
        div.dataset.match = pair.match;
        div.id = 'bin-' + pair.value;
        div.addEventListener('dragstart', dragStart);

        container.appendChild(div);
        binaryCol.appendChild(container);
      });

      shuffle(decimalPairs).forEach(val => {
        const dropzone = document.createElement('div');
        dropzone.className = 'dropzone';
        dropzone.textContent = val;
        dropzone.dataset.value = val;
        dropzone.addEventListener('dragover', dragOver);
        dropzone.addEventListener('drop', handleDrop);
        decimalCol.appendChild(dropzone);
      });
    }

    function dragStart(e) {
      e.dataTransfer.setData('text/plain', e.target.dataset.match);
      e.dataTransfer.setData('element-id', e.target.id);
    }

    function dragOver(e) {
      e.preventDefault();
    }

    function handleDrop(e) {
      e.preventDefault();
      const draggedMatch = e.dataTransfer.getData('text/plain');
      const draggedId = e.dataTransfer.getData('element-id');
      const draggedEl = document.getElementById(draggedId);
      const dropValue = e.target.dataset.value;

      if (draggedMatch === dropValue) {
        e.target.textContent = `${draggedEl.textContent} = ${dropValue}`;
        e.target.style.backgroundColor = '#c8e6c9';
        e.target.style.borderColor = '#2e7d32';
        draggedEl.parentNode.innerHTML = '&nbsp;';
      } else {
        e.target.style.backgroundColor = '#ffcdd2';
        e.target.style.borderColor = '#c62828';
        setTimeout(() => {
          e.target.style.backgroundColor = '#eee';
          e.target.style.borderColor = '#aaa';
        }, 1000);
      }
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    window.addEventListener('DOMContentLoaded', generatePairs);
  </script>
</body>
</html>
