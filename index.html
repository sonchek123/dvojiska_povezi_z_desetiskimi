<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izreži in poveži: dvojiško ↔ desetiško</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #f9f9f9;
    }
    h1 {
      margin-bottom: 1rem;
    }
    #controls {
      margin-bottom: 1.5rem;
    }
    .btn-group button {
      margin: 0.25rem;
      padding: 0.5rem 1rem;
      border: 2px solid #ccc;
      background: white;
      cursor: pointer;
    }
    .btn-group button.selected {
      border-color: #1e88e5;
      background-color: #e3f2fd;
      font-weight: bold;
    }
    .columns {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }
    .column {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1 1 200px;
    }
    .pair {
      margin: 0.5rem;
      padding: 0.5rem 1rem;
      border: 1px dashed #aaa;
      background: white;
      width: 100px;
    }
  </style>
</head>
<body>
  <h1>Izreži in poveži: dvojiško ↔ desetiško</h1>
  <div id="controls">
    <div class="btn-group">
      <span>Število parov:</span>
      <button data-count="5">5</button>
      <button data-count="10" class="selected">10</button>
      <button data-count="15">15</button>
    </div>
    <div class="btn-group">
      <span>Obseg števil:</span>
      <button data-max="15" class="selected">1–15</button>
      <button data-max="31">1–31</button>
      <button data-max="63">1–63</button>
    </div>
    <div>
      <button onclick="generatePairs()">Ustvari nalogo</button>
    </div>
  </div>
  <div class="columns">
    <div class="column" id="binary"></div>
    <div class="column" id="decimal"></div>
  </div>

  <script>
    let pairCount = 10;
    let numberMax = 15;

    document.querySelectorAll('[data-count]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-count]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        pairCount = parseInt(btn.dataset.count);
      });
    });

    document.querySelectorAll('[data-max]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-max]').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        numberMax = parseInt(btn.dataset.max);
      });
    });

    function generatePairs() {
      const numbers = Array.from({ length: numberMax }, (_, i) => i + 1);
      const selected = shuffle(numbers).slice(0, pairCount);

      const binaryCol = document.getElementById('binary');
      const decimalCol = document.getElementById('decimal');
      binaryCol.innerHTML = '';
      decimalCol.innerHTML = '';

      const binaryPairs = selected.map(n => n.toString(2).padStart(5, '0'));
      const decimalPairs = selected.map(n => n.toString());

      shuffle(binaryPairs).forEach(val => {
        const div = document.createElement('div');
        div.className = 'pair';
        div.textContent = val;
        binaryCol.appendChild(div);
      });

      shuffle(decimalPairs).forEach(val => {
        const div = document.createElement('div');
        div.className = 'pair';
        div.textContent = val;
        decimalCol.appendChild(div);
      });
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }

    // začetna naloga
    window.addEventListener('DOMContentLoaded', generatePairs);
  </script>
</body>
</html>
